    .side { fill: none; stroke: #5e6573; stroke-width: 1.75; }
    .read { fill: none; stroke: #5e6573; stroke-width: 1.75; stroke-dasharray: 6 5; }
    .ahm { fill: #15171c; } .ahs { fill: #5e6573; }
    .door rect { fill: #121316; stroke: #121316; stroke-width: 1.5; }
    .door text { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; }
    .pl { font-size: 15px; fill: #15171c; }
    .h1 { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; font-size: 46px; fill: #15171c; }
    .brand { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.14em; fill: #15171c; }
    .sub { font-family: Overpass, "Segoe UI", Arial, sans-serif; font-size: 18px; fill: #3f4550; }
    .lg { font-size: 15px; fill: #3f4550; }
