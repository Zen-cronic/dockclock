    .ll.m { fill: #2f55d4; } .ll.d { fill: #0f7543; } .ll.n { fill: #3f4550; font-size: 21px; }
    .ls, .tg, .tc, .te, .tb, .pl, .lg { font-family: Overpass, "Segoe UI", Arial, sans-serif; }
