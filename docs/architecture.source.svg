    .edge-box.m { stroke: #2f55d4; stroke-width: 2.5; } .edge-box.d { stroke: #0f7543; stroke-width: 2.5; }
    .edge-box.p { stroke: #5e6573; stroke-dasharray: 5 4; } .edge-box.pd { stroke: #0f7543; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .tt, .tr { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; letter-spacing: 0.01em; fill: #15171c; }
    .tt { font-size: 25px; } .tr { font-size: 21px; }
    .tg { font-weight: 400; font-size: 14.5px; fill: #3f4550; }
    .td { font-family: "Overpass Mono", Menlo, monospace; font-size: 13.5px; }
    .tc { font-size: 16px; fill: #3f4550; }
    .te { font-weight: 600; font-size: 15px; fill: #3f4550; }
    .tb { font-weight: 700; font-size: 14px; }
    .seal { fill: #fbf0b8; } .seal-t { fill: #1f2a55; } .money { fill: #ffc400; } .money-t { fill: #15171c; }
    .sw { stroke: #c9b04a; stroke-width: 1.5; }
    .div { stroke: #b9c0b9; stroke-width: 1; }
