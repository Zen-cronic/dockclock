          <text class="tc" x="564" y="434">verdict and amount</text>
          <text class="tb seal-t" x="564" y="465">AWS KMS + S3 Object Lock</text>

          <!-- 6 Dispatch -->
          <rect class="node p" x="816" y="360" width="158" height="116" rx="10"/>
          <rect class="edge-box pd" x="816" y="360" width="158" height="116" rx="10"/>
          <text class="tt" x="836" y="395">Dispatcher</text>
          <text class="tg" x="836" y="414">on WhatsApp</text>
          <text class="tc" x="836" y="434">one Approve tap</text>

          <!-- 7 Agent -->
          <rect class="node" x="1010" y="28" width="280" height="100" rx="10"/>
          <rect class="edge-box m" x="1010" y="28" width="280" height="100" rx="10"/>
          <text class="tt" x="1030" y="65">Claims agent</text>
          <text class="tg" x="1030" y="86">Bedrock AgentCore Harness</text>
          <text class="tc" x="1030" y="109">drafts the opening line</text>

          <!-- 8 Gateway and Cedar -->
          <rect class="node" x="1010" y="360" width="280" height="116" rx="10"/>
          <path class="money" d="M1011 444H1289V466Q1289 475 1280 475H1020Q1011 475 1011 466Z"/>
          <rect class="edge-box d" x="1010" y="360" width="280" height="116" rx="10"/>
          <text class="tt" x="1030" y="395">Gateway + Cedar</text>
          <text class="tg" x="1030" y="414">AgentCore Gateway + Cedar policy</text>
          <text class="tc" x="1030" y="434">claim tool only after approval</text>
          <text class="tb money-t" x="1030" y="465">Amount + digest must match</text>

          <!-- 9 SES -->
          <rect class="node" x="1088" y="196" width="196" height="114" rx="10"/>
          <rect class="edge-box" x="1088" y="196" width="196" height="114" rx="10"/>
          <text class="tt" x="1108" y="237">Claim email</text>
          <text class="tg" x="1108" y="256">Amazon SES</text>
          <text class="tc" x="1108" y="278">notice, then the claim</text>
          <text class="tc" x="1108" y="296">PDF + signed pack</text>

          <!-- 10 Inbox -->
          <rect class="node p" x="1312" y="196" width="172" height="114" rx="10"/>
          <rect class="edge-box p" x="1312" y="196" width="172" height="114" rx="10"/>
          <text class="tt" x="1332" y="241">Broker inbox</text>
          <text class="tg" x="1332" y="262">Fictional</text>
          <text class="tc" x="1332" y="287">broker or shipper</text>

          <!-- Judge console -->
