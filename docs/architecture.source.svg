          <path class="seal" d="M545 444H783V466Q783 475 774 475H554Q545 475 545 466Z"/>
          <rect class="edge-box d" x="544" y="360" width="240" height="116" rx="10"/>
          <text class="tt" x="564" y="395">Contract decides</text>
