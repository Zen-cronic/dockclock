          <g class="door"><rect x="998" y="346" width="30" height="30" rx="5"/><text x="1013" y="369" text-anchor="middle">8</text></g>
          <g class="door"><rect x="1076" y="182" width="30" height="30" rx="5"/><text x="1091" y="205" text-anchor="middle">9</text></g>
          <g class="door"><rect x="1300" y="182" width="30" height="30" rx="5"/><text x="1315" y="205" text-anchor="middle">10</text></g>
          </g>
  <g transform="translate(20,815)"><line class="main" x1="2" y1="9" x2="44" y2="9"/><text class="lg" x="56" y="13">Main path, numbered</text></g><g transform="translate(237,815)"><line class="read" x1="2" y1="9" x2="44" y2="9"/><text class="lg" x="56" y="13">Read-only view</text></g><g transform="translate(416,815)"><rect class="node" x="1.5" y="1.5" width="43" height="15" rx="4"/><rect class="edge-box m" x="1.5" y="1.5" width="43" height="15" rx="4"/><text class="lg" x="56" y="13">The model reads or drafts</text></g><g transform="translate(664,815)"><rect class="node" x="1.5" y="1.5" width="43" height="15" rx="4"/><rect class="edge-box d" x="1.5" y="1.5" width="43" height="15" rx="4"/><text class="lg" x="56" y="13">Code, Cedar or a person decides</text></g><g transform="translate(956,815)"><rect class="seal sw" x="1.5" y="1.5" width="43" height="15" rx="4"/><text class="lg" x="56" y="13">Sealed evidence pack</text></g><g transform="translate(1176,815)"><rect class="money" x="1" y="1" width="44" height="16" rx="4"/><text class="lg" x="56" y="13">Money check</text></g><g transform="translate(1339,815)"><rect class="node p" x="1.5" y="1.5" width="43" height="15" rx="4"/><rect class="edge-box p" x="1.5" y="1.5" width="43" height="15" rx="4"/><text class="lg" x="56" y="13">A person, not AWS</text></g>
</svg>
