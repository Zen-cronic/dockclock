          <text class="ll n" x="24" y="562">JUDGE CONSOLE · NO LOGIN</text>
          <rect class="node p" x="24" y="584" width="196" height="76" rx="10"/>
          <rect class="edge-box p" x="24" y="584" width="196" height="76" rx="10"/>
          <text class="tr" x="42" y="612">Judge's browser</text>
          <text class="tg" x="42" y="636">Console and <tspan class="td">/judges</tspan></text>
          <line class="side" x1="220" y1="622" x2="250" y2="622" marker-end="url(#as)"/>
          <rect class="node" x="252" y="584" width="228" height="76" rx="10"/>
          <rect class="edge-box" x="252" y="584" width="228" height="76" rx="10"/>
          <text class="tr" x="270" y="612">Amazon CloudFront</text>
          <text class="tg" x="270" y="636">Site on S3, <tspan class="td">/api/*</tspan></text>
          <line class="side" x1="480" y1="622" x2="510" y2="622" marker-end="url(#as)"/>
          <rect class="node" x="512" y="584" width="272" height="76" rx="10"/>
          <rect class="edge-box" x="512" y="584" width="272" height="76" rx="10"/>
          <text class="tr" x="530" y="612">Read API</text>
          <text class="tg" x="618" y="612">read-only</text>
          <text class="tc" x="530" y="640">no typed text or photo shown</text>

          <!-- Plumbing -->
          <rect class="lane-n" x="830" y="530" width="670" height="146" rx="16"/>
          <text class="ll n" x="854" y="562">PLUMBING</text>
          <text class="pl" x="854" y="602">Amazon SNS&#160;&#160;/&#160;&#160;Amazon SQS + dead-letter queue&#160;&#160;/&#160;&#160;AWS Lambda</text>
          <text class="pl" x="854" y="628">Amazon DynamoDB&#160;&#160;/&#160;&#160;EventBridge Scheduler&#160;&#160;/&#160;&#160;AWS Secrets Manager</text>
          <text class="pl" x="854" y="654">Amazon CloudWatch&#160;&#160;/&#160;&#160;AWS X-Ray&#160;&#160;/&#160;&#160;AWS CDK</text>

          <!-- Door numbers -->
          <g class="door"><rect x="0" y="182" width="30" height="30" rx="5"/><text x="15" y="205" text-anchor="middle">1</text></g>
          <g class="door"><rect x="216" y="182" width="30" height="30" rx="5"/><text x="231" y="205" text-anchor="middle">2</text></g>
          <g class="door"><rect x="532" y="182" width="30" height="30" rx="5"/><text x="547" y="205" text-anchor="middle">3</text></g>
