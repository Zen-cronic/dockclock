    <text class="brand" x="42" y="22">DOCKCLOCK</text>
  </g>
  <text class="h1" x="20" y="96">DockClock architecture</text>
  <text class="sub" x="470" y="94">One load, from the driver's tap at the dock to the claim in the broker's inbox. Follow the numbers.</text>
  <g transform="translate(20,118)">
          

          <!-- Lanes -->
          <rect class="lane-m" x="0" y="0" width="1500" height="156" rx="16"/>
          <text class="ll m" x="28" y="64">MODEL READS AND DRAFTS</text>
          <text class="ls" x="28" y="94">It never sets a time, a verdict or an amount.</text>

          <rect class="lane-d" x="0" y="336" width="1500" height="170" rx="16"/>
          <text class="ll d" x="28" y="404">CODE AND CEDAR DECIDE</text>
          <text class="ls" x="28" y="434">Plain code, a Cedar policy and one person's tap.</text>

          <!-- Main path -->
          <line class="main" x1="198" y1="253" x2="226" y2="253" marker-start="url(#am)" marker-end="url(#am)"/>
          <line class="main" x1="514" y1="253" x2="542" y2="253" marker-end="url(#am)"/>
          <line class="main" x1="700" y1="194" x2="700" y2="130" marker-start="url(#am)" marker-end="url(#am)"/>
          <text class="te" x="712" y="172">BOL photo</text>
          <line class="main" x1="620" y1="312" x2="620" y2="358" marker-start="url(#am)" marker-end="url(#am)"/>
          <text class="te" x="632" y="340">seal, verdict</text>
          <line class="main" x1="895" y1="312" x2="895" y2="358" marker-start="url(#am)" marker-end="url(#am)"/>
          <text class="te" x="907" y="340">Approve?</text>
          <path class="main" d="M950 196V78H1008" marker-end="url(#am)"/>
          <text class="te" x="940" y="180" text-anchor="end">starts the agent</text>
          <line class="main" x1="1040" y1="128" x2="1040" y2="358" marker-end="url(#am)"/>
          <text class="te" x="1050" y="340">tool calls</text>
          <line class="main" x1="1200" y1="360" x2="1200" y2="312" marker-end="url(#am)"/>
          <text class="te" x="1212" y="340">claim + pack</text>
          <line class="main" x1="1284" y1="253" x2="1312" y2="253" marker-end="url(#am)"/>


          <!-- Judge console reads -->
          <line class="read" x1="664" y1="582" x2="664" y2="480" marker-end="url(#as)"/>
          <text class="te" x="676" y="524">reads only</text>

          <!-- 1 Driver -->
          <rect class="node p" x="12" y="196" width="184" height="114" rx="10"/>
          <rect class="edge-box p" x="12" y="196" width="184" height="114" rx="10"/>
          <text class="tt" x="32" y="241">Driver's phone</text>
          <text class="tg" x="32" y="262">WhatsApp or RCS</text>
          <text class="tc" x="32" y="287">taps, pins, BOL photo</text>

          <!-- 2 End User Messaging -->
          <rect class="node" x="228" y="196" width="284" height="114" rx="10"/>
          <rect class="edge-box" x="228" y="196" width="284" height="114" rx="10"/>
          <text class="tr" x="248" y="230">WhatsApp</text>
          <text class="tg" x="248" y="249">AWS End User Messaging Social</text>
          <line class="div" x1="248" y1="262" x2="492" y2="262"/>
          <text class="tr" x="248" y="286">RCS fallback</text>
          <text class="tg" x="248" y="304">AWS End User Messaging</text>

          <!-- 3 Workflow -->
          <rect class="node" x="544" y="196" width="430" height="114" rx="10"/>
          <rect class="edge-box" x="544" y="196" width="430" height="114" rx="10"/>
          <text class="tt" x="564" y="237">Load workflow</text>
          <text class="tg" x="564" y="256">AWS Step Functions</text>
          <text class="tc" x="564" y="278">pins, notice, BOL photo, seal, approval</text>
          <text class="tc" x="564" y="296">clock stops at the Released tap</text>

          <!-- 4 BOL read -->
          <rect class="node" x="590" y="28" width="260" height="100" rx="10"/>
          <rect class="edge-box m" x="590" y="28" width="260" height="100" rx="10"/>
          <text class="tt" x="610" y="65">Reads the BOL photo</text>
          <text class="tg" x="610" y="86">Claude on Amazon Bedrock</text>
          <text class="tc" x="610" y="109">raises or lowers confidence</text>

          <!-- 5 Contract decides -->
