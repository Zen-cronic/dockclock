<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 858" width="1540" height="858" role="img" aria-labelledby="t d">
  <!-- Source of docs/architecture.png and docs/architecture.svg. Edit this file, then run `npm run diagram`. -->
  <title id="t">DockClock architecture: one load in ten steps</title>
  <desc id="d">1 The driver's phone sends taps, pins and a bill-of-lading photo over WhatsApp, or RCS as a fallback. 2 AWS End User Messaging Social carries WhatsApp and AWS End User Messaging carries RCS. 3 An AWS Step Functions workflow runs the load; the dock clock stops at the Released tap and a pin within 10 minutes confirms it. 4 Claude on Amazon Bedrock reads the bill-of-lading photo and only raises or lowers confidence. 5 The clause engine, in plain code, sets the verdict and the amount, and the evidence pack is signed with AWS KMS and stored under S3 Object Lock. 6 The dispatcher approves with one WhatsApp tap. 7 A Bedrock AgentCore Harness agent drafts the claim's opening line. 8 Its tool calls pass the AgentCore Gateway and a Cedar policy, and the claim tool refuses unless the amount and digest match the sealed pack. 9 Amazon SES sends the notice, then the claim with a PDF summary and the signed pack. 10 The fictional broker or shipper inbox receives it. A judge console on Amazon CloudFront calls a read-only API that hides typed text and photos on demo loads.</desc>
  <style>
